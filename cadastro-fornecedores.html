<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Cadastro de Fornecedores</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Cadastro de Fornecedores</h1>
                <button class="btn btn-primary" id="btnNovoFornecedor">+ Novo Fornecedor</button>
            </div>
        </div>

        <div class="container">
            <!-- Busca -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por nome ou código...">
                <button class="btn btn-secondary">🔍 Buscar</button>
            </div>

            <!-- Tabela de Fornecedores -->
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>CPF/CNPJ</th>
                            <th>Inscrição Estadual</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="fornecedoresTable">
                        <tr>
                            <td colspan="7" class="empty-message">Nenhum fornecedor cadastrado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro/Edição -->
    <div class="modal" id="fornecedorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="fornecedorModalTitle">Novo Fornecedor</h2>
                <button class="modal-close" id="closeFornecedorModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="fornecedorForm">
                    <div class="form-group">
                        <label for="fornecedorNome">Nome *</label>
                        <input type="text" id="fornecedorNome" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedorCPFCNPJ">CPF/CNPJ *</label>
                            <input type="text" id="fornecedorCPFCNPJ" required>
                        </div>
                        <div class="form-group">
                            <label for="fornecedorIE">Inscrição Estadual</label>
                            <input type="text" id="fornecedorIE">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedorCEP">CEP *</label>
                            <input type="text" id="fornecedorCEP" placeholder="00000-000" required>
                        </div>
                        <div class="form-group">
                            <label for="fornecedorCidade">Cidade *</label>
                            <input type="text" id="fornecedorCidade" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedorBairro">Bairro *</label>
                            <input type="text" id="fornecedorBairro" required>
                        </div>
                        <div class="form-group">
                            <label for="fornecedorRua">Rua *</label>
                            <input type="text" id="fornecedorRua" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fornecedorNumero">Número *</label>
                            <input type="text" id="fornecedorNumero" required>
                        </div>
                        <div class="form-group">
                            <label for="fornecedorTelefone">Telefone *</label>
                            <input type="tel" id="fornecedorTelefone" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fornecedorEmail">Email *</label>
                        <input type="email" id="fornecedorEmail" required>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelFornecedorBtn">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Fornecedor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts como módulos ES6 -->
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script type="module" src="compras.js"></script>
</body>

</html>
