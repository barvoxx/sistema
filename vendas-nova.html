<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Nova Venda</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Nova Venda</h1>
            </div>
        </div>

        <div class="container">
            <div class="form-section">
                <h2>Dados da Venda</h2>
                
                <form id="vendaForm">
                    <!-- Dados do Cliente -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vendaCliente">Cliente *</label>
                            <select id="vendaCliente" required>
                                <option value="">Selecionar cliente...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="vendaData">Data da Venda *</label>
                            <input type="date" id="vendaData" required>
                        </div>
                    </div>

                    <!-- Adicionar Produtos -->
                    <h3 style="margin-top: 20px;">Itens da Venda</h3>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label for="vendaProduto">Produto</label>
                            <select id="vendaProduto">
                                <option value="">Buscar produto...</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-secondary" id="btnAdicionarProduto" style="margin-top: 22px;">Adicionar</button>
                    </div>

                    <!-- Tabela de Itens -->
                    <table class="data-table" style="margin-top: 15px; font-size: 13px;">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th>Embalagem</th>
                                <th>Quantidade</th>
                                <th>Valor Unitário</th>
                                <th>Desconto</th>
                                <th>Subtotal</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="vendaItens">
                            <tr>
                                <td colspan="8" class="empty-message">Nenhum produto adicionado</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Resumo -->
                    <div style="background: var(--light-color); padding: 15px; border-radius: 6px; margin-top: 15px;">
                        <div class="form-row" style="gap: 30px;">
                            <div>
                                <label>Subtotal:</label>
                                <div style="font-size: 18px; font-weight: bold; color: var(--primary-color);" id="vendaSubtotal">R$ 0,00</div>
                            </div>
                            <div>
                                <label>Desconto:</label>
                                <input type="number" id="vendaDesconto" min="0" step="0.01" value="0" style="width: 150px;">
                            </div>
                            <div>
                                <label>Frete:</label>
                                <input type="number" id="vendaFrete" min="0" step="0.01" value="0" style="width: 150px;">
                            </div>
                            <div>
                                <label>Total:</label>
                                <div style="font-size: 20px; font-weight: bold; color: var(--success-color);" id="vendaTotal">R$ 0,00</div>
                            </div>
                        </div>
                    </div>

                    <!-- Forma de Pagamento -->
                    <h3 style="margin-top: 20px;">Forma de Pagamento</h3>
                    <div class="form-group">
                        <label for="vendaPagamento">Forma de Pagamento *</label>
                        <select id="vendaPagamento" required>
                            <option value="">Selecionar...</option>
                            <option value="pix">PIX</option>
                            <option value="cartao">Cartão</option>
                            <option value="boleto">Boleto</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="parcelado">Parcelado</option>
                        </select>
                    </div>

                    <div style="margin-top: 30px; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Registrar Venda</button>
                        <button type="button" class="btn btn-secondary" id="btnGeraNota">🧾 Gerar Nota</button>
                        <button type="button" class="btn btn-secondary" id="btnLimpar">🔄 Limpar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Scripts como módulos ES6 -->
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script type="module" src="vendas.js"></script>
</body>

</html>
