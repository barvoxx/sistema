<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Configurações</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Configurações</h1>
            </div>
        </div>

        <div class="container">
            <!-- Perfil do Usuário -->
            <div class="form-section">
                <h2>Perfil do Usuário</h2>
                <form id="perfilForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nomeDaEmpresa">Nome da Empresa</label>
                            <input type="text" id="nomeDaEmpresa">
                        </div>
                        <div class="form-group">
                            <label for="nomeResponsavel">Responsável</label>
                            <input type="text" id="nomeResponsavel">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="emailEmpresa">Email da Empresa</label>
                            <input type="email" id="emailEmpresa">
                        </div>
                        <div class="form-group">
                            <label for="telefonEmpresa">Telefone</label>
                            <input type="tel" id="telefonEmpresa">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj">
                        </div>
                        <div class="form-group">
                            <label for="inscricaoEstadual">Inscrição Estadual</label>
                            <input type="text" id="inscricaoEstadual">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco">
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade">
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">💾 Salvar Perfil</button>
                    </div>
                </form>
            </div>

            <!-- Preferências -->
            <div class="form-section" style="margin-top: 30px;">
                <h2>Preferências</h2>
                <form id="preferenciasForm">
                    <div class="form-group">
                        <label for="idioma">Idioma</label>
                        <select id="idioma">
                            <option value="pt-br">Português (Brasil)</option>
                            <option value="en">Inglês</option>
                            <option value="es">Espanhol</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tema">Tema</label>
                        <select id="tema">
                            <option value="claro">Claro</option>
                            <option value="escuro">Escuro</option>
                            <option value="auto">Automático</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="notificacoes"> Receber notificações por email</label>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">💾 Salvar Preferências</button>
                    </div>
                </form>
            </div>

            <!-- Segurança -->
            <div class="form-section" style="margin-top: 30px;">
                <h2>Segurança</h2>
                <form id="segurancaForm">
                    <div class="form-group">
                        <label for="senhaAtual">Senha Atual *</label>
                        <input type="password" id="senhaAtual" required>
                    </div>
                    <div class="form-group">
                        <label for="novaSenha">Nova Senha *</label>
                        <input type="password" id="novaSenha" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Senha *</label>
                        <input type="password" id="confirmarSenha" required>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">🔐 Alterar Senha</button>
                    </div>
                </form>
            </div>

            <!-- Deletar Conta -->
            <div class="form-section" style="margin-top: 30px; border: 2px solid var(--danger-color); padding: 20px;">
                <h2 style="color: var(--danger-color);">Zona de Perigo</h2>
                <p>Ao deletar sua conta, todos os dados serão permanentemente removidos. Esta ação não pode ser desfeita.</p>
                <button type="button" class="btn btn-danger" id="btnDeletarConta">🗑️ Deletar Conta Permanentemente</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script type="module">
        import { auth, db, waitForAuthenticatedUser, doc, deleteDoc, updateDoc } from './firebase-config.js';
        import { getUserData, updateUserData } from './auth.js';
        import { showToast } from './utils.js';

        // Carregar dados do perfil
        async function loadPerfilData() {
            const user = await waitForAuthenticatedUser();
            if (!user) return;

            try {
                const userData = await getUserData();
                if (userData.success && userData.data) {
                    const data = userData.data;
                    document.getElementById('nomeDaEmpresa').value = data.company_name || '';
                    document.getElementById('nomeResponsavel').value = data.username || '';
                    document.getElementById('emailEmpresa').value = data.email || '';
                    document.getElementById('telefonEmpresa').value = data.phone || '';
                    document.getElementById('cnpj').value = data.cnpj || '';
                    document.getElementById('inscricaoEstadual').value = data.state_registration || '';
                    document.getElementById('endereco').value = data.address || '';
                    document.getElementById('cidade').value = data.city || '';
                }
            } catch (error) {
                console.error('Erro ao carregar perfil:', error);
            }
        }

        // Salvar perfil
        document.getElementById('perfilForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const userData = {
                company_name: document.getElementById('nomeDaEmpresa').value,
                phone: document.getElementById('telefonEmpresa').value,
                cnpj: document.getElementById('cnpj').value,
                state_registration: document.getElementById('inscricaoEstadual').value,
                address: document.getElementById('endereco').value,
                city: document.getElementById('cidade').value,
                updated_at: new Date().toISOString()
            };

            try {
                const result = await updateUserData(userData);
                showToast(result.success ? 'Perfil atualizado com sucesso' : result.message, result.success ? 'success' : 'error');
            } catch (error) {
                console.error('Erro ao atualizar perfil:', error);
                showToast('Erro ao atualizar perfil', 'error');
            }
        });

        // Salvar preferências
        document.getElementById('preferenciasForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const prefs = {
                language: document.getElementById('idioma').value,
                theme: document.getElementById('tema').value,
                notifications: document.getElementById('notificacoes').checked,
                updated_at: new Date().toISOString()
            };

            try {
                await updateDoc(doc(db, 'users', user.uid), prefs);
                showToast('Preferências salvas com sucesso', 'success');
            } catch (error) {
                console.error('Erro ao salvar preferências:', error);
                showToast('Erro ao salvar preferências', 'error');
            }
        });

        // Alterar senha
        document.getElementById('segurancaForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (novaSenha !== confirmarSenha) {
                showToast('As senhas não correspondem', 'warning');
                return;
            }

            if (novaSenha.length < 8) {
                showToast('A senha deve ter pelo menos 8 caracteres', 'warning');
                return;
            }

            try {
                const user = auth.currentUser;
                await user.updatePassword(novaSenha);
                showToast('Senha alterada com sucesso', 'success');
                document.getElementById('segurancaForm').reset();
            } catch (error) {
                console.error('Erro ao alterar senha:', error);
                if (error.code === 'auth/weak-password') {
                    showToast('Senha fraca. Use caracteres especiais e números', 'error');
                } else {
                    showToast('Erro ao alterar senha', 'error');
                }
            }
        });

        // Deletar conta
        document.getElementById('btnDeletarConta')?.addEventListener('click', async () => {
            const confirmacao = confirm('Tem certeza que deseja deletar sua conta? Esta ação é irreversível!');
            if (!confirmacao) return;

            const user = auth.currentUser;
            if (!user) return;

            try {
                // Deletar dados do usuário do Firestore
                await deleteDoc(doc(db, 'users', user.uid));

                // Deletar conta do Firebase Auth
                await user.delete();

                showToast('Conta deletada com sucesso', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                console.error('Erro ao deletar conta:', error);
                showToast('Erro ao deletar conta: ' + error.message, 'error');
            }
        });

        // Carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', loadPerfilData);
    </script>
</body>

</html>
