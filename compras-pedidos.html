<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Pedido de Compra</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Pedido de Compra</h1>
                <button class="btn btn-primary" id="btnNovoPedido">+ Novo Pedido</button>
            </div>
        </div>

        <div class="container">
            <!-- Busca -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por código do pedido...">
                <button class="btn btn-secondary">🔍 Buscar</button>
            </div>

            <!-- Tabela de Pedidos -->
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Fornecedor</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Forma de Pagamento</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="pedidosTable">
                        <tr>
                            <td colspan="7" class="empty-message">Nenhum pedido registrado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Novo Pedido -->
    <div class="modal" id="pedidoModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2 id="pedidoModalTitle">Novo Pedido de Compra</h2>
                <button class="modal-close" id="closePedidoModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="pedidoForm">
                    <!-- Dados Principais -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pedidoFornecedor">Fornecedor *</label>
                            <select id="pedidoFornecedor" required>
                                <option value="">Selecionar fornecedor...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pedidoData">Data da Compra *</label>
                            <input type="date" id="pedidoData" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pedidoPagamento">Tipo de Pagamento *</label>
                            <select id="pedidoPagamento" required>
                                <option value="">Selecionar...</option>
                                <option value="pix">PIX</option>
                                <option value="cartao">Cartão</option>
                                <option value="boleto">Boleto</option>
                                <option value="dinheiro">Dinheiro</option>
                                <option value="parcelado">Parcelado</option>
                            </select>
                        </div>
                    </div>

                    <!-- Adicionar Produtos -->
                    <h3 style="margin-top: 20px;">Itens do Pedido</h3>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label for="pedidoProduto">Produto</label>
                            <select id="pedidoProduto">
                                <option value="">Buscar produto...</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-secondary" id="btnAdicionarProduto" style="margin-top: 22px;">Adicionar</button>
                    </div>

                    <!-- Tabela de Itens -->
                    <table class="data-table" style="margin-top: 15px; font-size: 13px;">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th>Embalagem</th>
                                <th>Quantidade</th>
                                <th>Valor Unitário</th>
                                <th>Desconto</th>
                                <th>Subtotal</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="pedidoItens">
                            <tr>
                                <td colspan="8" class="empty-message">Nenhum produto adicionado</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Resumo -->
                    <div style="background: var(--light-color); padding: 15px; border-radius: 6px; margin-top: 15px;">
                        <div class="form-row" style="gap: 30px;">
                            <div>
                                <label>Subtotal:</label>
                                <div style="font-size: 18px; font-weight: bold; color: var(--primary-color);" id="pedidoSubtotal">R$ 0,00</div>
                            </div>
                            <div>
                                <label>Desconto:</label>
                                <input type="number" id="pedidoDesconto" min="0" step="0.01" value="0" style="width: 150px;">
                            </div>
                            <div>
                                <label>Frete:</label>
                                <input type="number" id="pedidoFrete" min="0" step="0.01" value="0" style="width: 150px;">
                            </div>
                            <div>
                                <label>Total:</label>
                                <div style="font-size: 20px; font-weight: bold; color: var(--success-color);" id="pedidoTotal">R$ 0,00</div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelPedidoBtn">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Registrar Pedido</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="utils.js"></script>
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script src="compras.js"></script>
</body>

</html>
