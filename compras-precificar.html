<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Precificar Produtos</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Precificar Produtos</h1>
            </div>
        </div>

        <div class="container">
            <!-- Busca -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por código ou nome...">
                <button class="btn btn-secondary">🔍 Buscar</button>
            </div>

            <!-- Tabela de Precificação -->
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Produto</th>
                            <th>Custo Unitário</th>
                            <th>Preço de Venda</th>
                            <th>Margem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="precificacaoTable">
                        <tr>
                            <td colspan="6" class="empty-message">Nenhum produto para precificar</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Precificação -->
    <div class="modal" id="precificacaoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Precificar Produto</h2>
                <button class="modal-close" id="closePrecificacaoModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="precificacaoForm">
                    <div class="form-group">
                        <label for="precProduto">Produto</label>
                        <input type="text" id="precProduto" disabled>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="precCusto">Custo Unitário</label>
                            <input type="number" id="precCusto" disabled step="0.01">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="precPreco">Preço de Venda *</label>
                        <input type="number" id="precPreco" min="0" step="0.01" required>
                    </div>

                    <div style="background: var(--light-color); padding: 15px; border-radius: 6px; margin: 15px 0;">
                        <div class="form-row">
                            <div>
                                <label>Margem de Lucro:</label>
                                <div style="font-size: 20px; font-weight: bold; color: var(--success-color);" id="precMargem">0%</div>
                            </div>
                            <div>
                                <label>Lucro por Unidade:</label>
                                <div style="font-size: 18px; font-weight: bold; color: var(--primary-color);" id="precLucro">R$ 0,00</div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelPrecBtn">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Preço</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="utils.js"></script>
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script src="compras.js"></script>
</body>

</html>
