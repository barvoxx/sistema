<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARVOX - Cadastro de Clientes</title>
    <link rel="stylesheet" href="style-global.css">
    <link rel="stylesheet" href="style-modulos.css">
</head>

<body>
    <!-- Menu Lateral -->
    <div id="menu-container"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="topbar">
            <div class="topbar-content">
                <h1>Cadastro de Clientes</h1>
                <button class="btn btn-primary" id="btnNovoCliente">+ Novo Cliente</button>
            </div>
        </div>

        <div class="container">
            <!-- Busca -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por nome ou código...">
                <button class="btn btn-secondary">🔍 Buscar</button>
            </div>

            <!-- Tabela de Clientes -->
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>CPF/CNPJ</th>
                            <th>Cidade</th>
                            <th>Telefone</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientesTable">
                        <tr>
                            <td colspan="6" class="empty-message">Nenhum cliente cadastrado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro/Edição -->
    <div class="modal" id="clienteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="clienteModalTitle">Novo Cliente</h2>
                <button class="modal-close" id="closeClienteModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="clienteForm">
                    <div class="form-group">
                        <label for="clienteNome">Nome *</label>
                        <input type="text" id="clienteNome" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="clienteCPFCNPJ">CPF/CNPJ *</label>
                            <input type="text" id="clienteCPFCNPJ" placeholder="000.000.000-00 ou 00.000.000/0000-00" required>
                        </div>
                        <div class="form-group">
                            <label for="clienteCEP">CEP *</label>
                            <input type="text" id="clienteCEP" placeholder="00000-000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="clienteCidade">Cidade *</label>
                            <input type="text" id="clienteCidade" required>
                        </div>
                        <div class="form-group">
                            <label for="clienteBairro">Bairro *</label>
                            <input type="text" id="clienteBairro" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="clienteRua">Rua *</label>
                            <input type="text" id="clienteRua" required>
                        </div>
                        <div class="form-group">
                            <label for="clienteNumero">Número *</label>
                            <input type="text" id="clienteNumero" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="clienteTelefone">Telefone *</label>
                        <input type="tel" id="clienteTelefone" placeholder="(11) 99999-9999" required>
                    </div>

                    <div class="form-group">
                        <label for="clienteEmail">Email</label>
                        <input type="email" id="clienteEmail">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelClienteBtn">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts como módulos ES6 -->
    <script>
        fetch('menu-lateral.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('menu-container').innerHTML = html;
                if (typeof initializeMenu === 'function') {
                    initializeMenu();
                }
            });
    </script>
    <script type="module" src="compras.js"></script>
</body>

</html>
